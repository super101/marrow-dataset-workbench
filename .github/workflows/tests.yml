name: Synthetic workbench and intake checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m workbench --help
      - run: python -X utf8 -m unittest discover -s tests -v
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify frontend is packaged
        run: python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert 'workbench/static/index.html' in n; assert any(x.startswith('workbench/static/') and x.endswith('.js') for x in n); assert any(x.startswith('workbench/static/') and x.endswith('.css') for x in n)"
