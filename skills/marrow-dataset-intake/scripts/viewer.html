<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>细胞数据集工作版</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#142b3f;margin:24px}header{background:white;padding:24px;border-radius:12px}select,button{font:inherit;padding:8px;margin:8px}#stats{line-height:1.8}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}.card{background:white;padding:14px;border-radius:10px}.image{position:relative}.image img{width:100%;display:block}.image svg{position:absolute;inset:0;width:100%;height:100%}svg rect{fill:none;stroke:#00e6af;stroke-width:5}svg text{fill:#102b36;paint-order:stroke;stroke:white;stroke-width:2;font-size:38px}small{color:#516273}table{border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #dde3e8;text-align:left}a{color:#086d99}</style>
<header><h1>细胞数据集工作版</h1><p>原图保持原样；当前版本待复核。图像数量不代表独立患者数。</p><div id="stats"></div><label>查看类别 <select id="label"><option value="">全部</option></select></label><label>待复核问题 <select id="issue"><option value="">全部</option></select></label><button id="prev">上一页</button><button id="next">下一页</button><span id="page"></span><details><summary>类别数量与状态</summary><table id="counts"></table></details></header><main id="cards"></main>
<script id="dataset" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('dataset').textContent);let page=0;
const selector=document.getElementById('label');
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
for(const l of data.labels){const o=el('option',`${l.code} · ${l.name} (${l.boxes})`);o.value=l.code;selector.append(o)}
const issueSelector=document.getElementById('issue');for(const issue of [...new Set(data.images.flatMap(i=>i.issues||[]))].sort()){const o=el('option',issue);o.value=issue;issueSelector.append(o)}
document.getElementById('stats').textContent=`${data.images.length} 张图像 · ${data.labels.reduce((a,b)=>a+b.boxes,0)} 个框 · 身份、标签和标注完整性以审核记录为准。`;
const table=document.getElementById('counts');for(const l of data.labels){const row=el('tr');for(const t of [l.code,l.name,l.role,l.boxes,l.images])row.append(el('td',t));table.append(row)}
function render(){const selected=selector.value,issue=issueSelector.value,images=data.images.filter(i=>(!selected||i.objects.some(o=>o.raw_code===selected))&&(!issue||(i.issues||[]).includes(issue))),pages=Math.max(1,Math.ceil(images.length/12));page=Math.max(0,Math.min(page,pages-1));document.getElementById('page').textContent=`${page+1} / ${pages} · ${images.length} 张`;const cards=document.getElementById('cards');cards.replaceChildren();for(const im of images.slice(page*12,page*12+12)){const card=el('article');card.className='card';card.append(el('h3',im.id));const box=el('div');box.className='image';const img=el('img');img.src=im.thumbnail||im.image;img.loading='lazy';img.alt=`图像 ${im.id}`;box.append(img);const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${im.width} ${im.height}`);for(const o of im.objects){if(!o.valid_box||selected&&o.raw_code!==selected)continue;const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x:o.xmin,y:o.ymin,width:o.xmax-o.xmin,height:o.ymax-o.ymin}))r.setAttribute(k,v);if(o.role!=='cell')r.style.stroke='#ff9b35';svg.append(r);const text=document.createElementNS(ns,'text');text.setAttribute('x',o.xmin);text.setAttribute('y',Math.max(40,o.ymin));text.textContent=o.raw_code;svg.append(text)}box.append(svg);card.append(box,el('p',`${im.width}×${im.height} · ${im.objects.length} 个框`),el('small',(im.issues||[]).join(' · ')));const link=el('a','打开工作版原图');link.href=im.image;link.target='_blank';link.rel='noopener';card.append(link);cards.append(card)}}
selector.onchange=()=>{page=0;render()};issueSelector.onchange=()=>{page=0;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};render();
</script></html>
