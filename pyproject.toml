[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marrow-dataset-workbench"
version = "0.2.1"
description = "Local microscopy annotation review and traceable training dataset export"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=10.4,<13"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
marrow-workbench = "workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.setuptools.package-data]
workbench = ["static/*", "static/**/*"]
